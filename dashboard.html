<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MPP UAT — Results Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --ink-900:#111827;--ink-800:#1f2937;--ink-700:#374151;--ink-600:#4b5563;--ink-500:#6b7280;
    --ink-400:#9ca3af;--ink-300:#d1d5db;--ink-200:#e5e7eb;--ink-100:#f3f4f6;--ink-50:#f9fafb;
    --paper:#fff;--line:#e5e7eb;--pttep:#c8102e;--warn:#b45309;--amber:#f59e0b;--ok:#047857;--info:#1d4ed8;
    --radius:10px;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink-50);color:var(--ink-900);font-family:var(--sans);font-size:14px;line-height:1.5;}
  .wrap{max-width:1160px;margin:0 auto;padding:28px 28px 80px;}
  header.cover{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:22px;}
  h1{margin:0;font-size:24px;font-weight:750;letter-spacing:-.02em;}
  .subtitle{color:var(--ink-500);font-size:13px;margin:3px 0 0;}
  .cover .right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .updated{font-size:12px;color:var(--ink-400);}
  .btn{cursor:pointer;font-size:13px;padding:8px 14px;border:1px solid var(--ink-300);border-radius:8px;background:var(--paper);color:var(--ink-700);font-weight:600;box-shadow:var(--shadow);}
  .btn:hover{background:var(--ink-100);}
  .btn.brand{background:var(--pttep);color:#fff;border-color:var(--pttep);}
  a.back{font-size:13px;color:var(--info);text-decoration:none;}
  a.back:hover{text-decoration:underline;}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px;}
  .kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  .kpi .label{font-size:12px;color:var(--ink-500);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .kpi .value{font-size:30px;font-weight:780;letter-spacing:-.02em;margin-top:6px;line-height:1;}
  .kpi .sub{font-size:12px;color:var(--ink-400);margin-top:6px;}
  .kpi.pass .value{color:var(--ok);} .kpi.fail .value{color:var(--pttep);}

  .grid2{display:grid;grid-template-columns:340px 1fr;gap:16px;margin-bottom:18px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .card h2{font-size:14px;font-weight:700;margin:0 0 14px;color:var(--ink-800);}
  .donut-wrap{position:relative;height:210px;}
  .bar-wrap{position:relative;height:340px;}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
  .donut-center b{font-size:30px;font-weight:780;letter-spacing:-.02em;}
  .donut-center span{font-size:11px;color:var(--ink-500);text-transform:uppercase;letter-spacing:.04em;}
  .legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:14px;font-size:12px;color:var(--ink-600);}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;font-weight:600;color:var(--ink-500);border-bottom:1px solid var(--line);padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
  tbody td{border-bottom:1px solid var(--ink-100);padding:9px 10px;vertical-align:middle;color:var(--ink-800);}
  tbody tr:hover{background:var(--ink-50);}
  td.tester{font-weight:650;}
  td.id{font-family:var(--mono);font-size:12px;color:var(--ink-600);white-space:nowrap;}
  td.num{text-align:center;width:54px;font-variant-numeric:tabular-nums;font-weight:600;}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;}
  .pill.pass{color:var(--ok);background:#ecfdf3;} .pill.fail{color:#fff;background:var(--pttep);}
  .pill.block{color:#92400e;background:#fef3c7;} .pill.todo{color:var(--ink-500);background:var(--ink-100);}
  .mini{height:8px;border-radius:999px;background:var(--ink-100);overflow:hidden;display:flex;min-width:110px;}
  .mini>span{display:block;height:100%;}
  .b-pass{background:var(--ok);} .b-fail{background:var(--pttep);} .b-block{background:var(--amber);}
  .att{display:flex;flex-direction:column;gap:8px;}
  .att .row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid #fee2e2;background:#fff5f5;border-radius:8px;}
  .att .row .id{font-family:var(--mono);font-size:12px;color:var(--pttep);font-weight:700;white-space:nowrap;}
  .att .row .who{margin-left:auto;font-size:12px;color:var(--ink-500);white-space:nowrap;}
  .empty-att{color:var(--ink-400);font-size:13px;padding:8px 0;}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
  select,input[type=search]{font-family:var(--sans);font-size:13px;padding:7px 10px;border:1px solid var(--ink-300);border-radius:8px;background:var(--paper);}
  .state{padding:48px 0;text-align:center;color:var(--ink-500);}
  .state a{color:var(--info);}
  .note{color:var(--ink-500);font-size:12px;}
  .sec-head{margin:26px 0 12px;font-size:15px;font-weight:700;}
  @media(max-width:880px){.kpis{grid-template-columns:repeat(2,1fr);}.grid2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="cover">
    <div>
      <h1>MPP UAT — Results Dashboard</h1>
      <p class="subtitle">Latest Pass / Fail submitted by each tester · <a class="back" href="uat-scenario.html">← back to test scenarios</a></p>
    </div>
    <div class="right">
      <span class="updated" id="updated"></span>
      <button class="btn" id="refresh">↻ Refresh</button>
    </div>
  </header>
  <div id="content"><div class="state" id="state">Loading results…</div></div>
</div>

<script>
(function(){
  var DRIVE_URL="https://script.google.com/macros/s/AKfycbyIoH_RHd50Gh6cPyYvUvBgSbcgQXF5x8TM8PmGi_AIg9yyJt7sNTlX1cM6Gj5iUly2Qg/exec";
  var COLORS={Pass:"#047857",Fail:"#c8102e",Blocked:"#f59e0b","Not run":"#d1d5db"};
  var ORDER={Pass:0,Fail:1,Blocked:2,"Not run":3};
  var charts=[];

  function jsonp(action,cb){
    var name="__dashCb_"+Math.floor(Math.random()*1e9),done=false;
    var s=document.createElement("script");
    function fin(d){if(done)return;done=true;try{delete window[name];}catch(e){window[name]=undefined;}
      if(s.parentNode)s.parentNode.removeChild(s);cb(d);}
    window[name]=function(d){fin(d);};
    s.onerror=function(){fin(null);};
    s.src=DRIVE_URL+(DRIVE_URL.indexOf("?")>-1?"&":"?")+"action="+action+"&callback="+name+"&t="+Date.now();
    document.body.appendChild(s);
    setTimeout(function(){fin(null);},18000);
  }
  function esc(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function pill(r){var k=r==="Pass"?"pass":r==="Fail"?"fail":r==="Blocked"?"block":"todo";return '<span class="pill '+k+'">'+esc(r||"Not run")+'</span>';}
  function fmt(ts){var d=new Date(ts);return isNaN(d)?"":d.toLocaleString();}
  function secName(s){return String(s||"").replace(/^(\d{2})\s*/,"$1 · ");}

  function render(data){
    var content=document.getElementById("content");
    if(!data||!data.ok){
      content.innerHTML='<div class="state">Could not load results.<br><br>'+
        'This is usually caused by being signed into <b>multiple Google accounts</b> in this browser '+
        '(the request gets routed to the wrong account). Try one of:<br>'+
        '• open this page in an <b>Incognito window</b>, or<br>'+
        '• set the Apps Script deployment access to <b>Anyone</b>.<br><br>'+
        '<a href="'+DRIVE_URL+'?action=results" target="_blank">Open raw data ↗</a></div>';
      return;
    }
    var rows=data.rows||[];
    charts.forEach(function(c){c.destroy();});charts=[];
    if(!rows.length){content.innerHTML='<div class="state">No results submitted yet. Once a tester taps “Submit result”, they appear here.</div>';return;}
    document.getElementById("updated").textContent="Updated "+new Date().toLocaleTimeString();

    // aggregates
    var ov={Pass:0,Fail:0,Blocked:0,"Not run":0,total:0};
    var by={}, sec={}, fails=[];
    rows.forEach(function(r){
      var res=r.result||"Not run"; if(ov[res]===undefined)res="Not run";
      ov[res]++; ov.total++;
      var t=r.tester||"(no name)";
      by[t]=by[t]||{tester:t,Pass:0,Fail:0,Blocked:0,"Not run":0,total:0,last:0};
      by[t][res]++; by[t].total++;
      var tm=new Date(r.ts).getTime(); if(tm>by[t].last)by[t].last=tm;
      var sn=secName(r.section);
      sec[sn]=sec[sn]||{Pass:0,Fail:0,Blocked:0,"Not run":0};
      sec[sn][res]++;
      if(res==="Fail")fails.push(r);
    });
    var testers=Object.keys(by).map(function(k){return by[k];}).sort(function(a,b){return b.last-a.last;});
    var done=ov.Pass+ov.Fail+ov.Blocked;
    var passRate=done?Math.round(ov.Pass/done*100):0;
    var completion=ov.total?Math.round(done/ov.total*100):0;

    var H="";
    // KPIs
    H+='<div class="kpis">'+
      '<div class="kpi"><div class="label">Testers</div><div class="value">'+testers.length+'</div><div class="sub">submitted results</div></div>'+
      '<div class="kpi pass"><div class="label">Pass rate</div><div class="value">'+passRate+'%</div><div class="sub">'+ov.Pass+' of '+done+' run</div></div>'+
      '<div class="kpi fail"><div class="label">Failed cases</div><div class="value">'+ov.Fail+'</div><div class="sub">need attention</div></div>'+
      '<div class="kpi"><div class="label">Completion</div><div class="value">'+completion+'%</div><div class="sub">'+done+' of '+ov.total+' executed</div></div>'+
    '</div>';

    // charts row
    H+='<div class="grid2">'+
      '<div class="card"><h2>Result distribution</h2>'+
        '<div class="donut-wrap"><canvas id="donut"></canvas>'+
        '<div class="donut-center"><b>'+passRate+'%</b><span>pass</span></div></div>'+
        '<div class="legend">'+
          '<span><i style="background:'+COLORS.Pass+'"></i>Pass '+ov.Pass+'</span>'+
          '<span><i style="background:'+COLORS.Fail+'"></i>Fail '+ov.Fail+'</span>'+
          '<span><i style="background:'+COLORS.Blocked+'"></i>Blocked '+ov.Blocked+'</span>'+
          '<span><i style="background:'+COLORS["Not run"]+'"></i>Not run '+ov["Not run"]+'</span>'+
        '</div></div>'+
      '<div class="card"><h2>By section</h2><div class="bar-wrap"><canvas id="bars"></canvas></div></div>'+
    '</div>';

    // needs attention
    H+='<div class="card"><h2>⚠ Needs attention — failed cases</h2><div class="att">';
    if(!fails.length){H+='<div class="empty-att">No failures reported. 🎉</div>';}
    else{
      fails.sort(function(a,b){return String(a.id).localeCompare(String(b.id),undefined,{numeric:true});});
      fails.forEach(function(r){
        H+='<div class="row"><span class="id">'+esc(r.id)+'</span><span>'+esc(r.title)+
           (r.note?' <span class="note">— '+esc(r.note)+'</span>':'')+'</span>'+
           '<span class="who">'+esc(r.tester)+'</span></div>';
      });
    }
    H+='</div></div>';

    // per-tester
    H+='<div class="sec-head">Per-tester summary</div><div class="card"><table><thead><tr>'+
      '<th>Tester</th><th>Last submitted</th><th class="num">Pass</th><th class="num">Fail</th>'+
      '<th class="num">Blocked</th><th class="num">Not run</th><th style="width:150px">Progress</th></tr></thead><tbody>';
    testers.forEach(function(t){
      var d=t.Pass+t.Fail+t.Blocked,T=t.total||1;
      H+='<tr><td class="tester">'+esc(t.tester)+'</td><td class="note">'+esc(fmt(t.last))+'</td>'+
        '<td class="num" style="color:var(--ok)">'+t.Pass+'</td>'+
        '<td class="num" style="color:var(--pttep)">'+t.Fail+'</td>'+
        '<td class="num" style="color:var(--warn)">'+t.Blocked+'</td>'+
        '<td class="num note">'+t["Not run"]+'</td>'+
        '<td><div class="mini">'+
          '<span class="b-pass" style="width:'+(t.Pass/T*100)+'%"></span>'+
          '<span class="b-fail" style="width:'+(t.Fail/T*100)+'%"></span>'+
          '<span class="b-block" style="width:'+(t.Blocked/T*100)+'%"></span>'+
        '</div><span class="note">'+d+'/'+t.total+'</span></td></tr>';
    });
    H+='</tbody></table></div>';

    // detail
    H+='<div class="sec-head">Latest result per test case</div><div class="card">'+
      '<div class="toolbar">'+
        '<select id="f-tester"><option value="">All testers</option>'+testers.map(function(t){return '<option>'+esc(t.tester)+'</option>';}).join("")+'</select>'+
        '<select id="f-res"><option value="">All results</option><option>Pass</option><option>Fail</option><option>Blocked</option><option>Not run</option></select>'+
        '<input type="search" id="f-q" placeholder="search id / test case…" style="min-width:220px">'+
      '</div>'+
      '<table><thead><tr><th class="id">ID</th><th>Test case</th><th>Tester</th><th style="width:90px">Result</th><th>Note</th><th class="note" style="width:150px">When</th></tr></thead><tbody id="detail"></tbody></table></div>';

    content.innerHTML=H;

    // donut
    charts.push(new Chart(document.getElementById("donut"),{type:"doughnut",
      data:{labels:["Pass","Fail","Blocked","Not run"],datasets:[{data:[ov.Pass,ov.Fail,ov.Blocked,ov["Not run"]],
        backgroundColor:[COLORS.Pass,COLORS.Fail,COLORS.Blocked,COLORS["Not run"]],borderWidth:0}]},
      options:{cutout:"70%",plugins:{legend:{display:false}},responsive:true,maintainAspectRatio:false}}));

    // bars by section (stacked)
    var secKeys=Object.keys(sec).sort();
    charts.push(new Chart(document.getElementById("bars"),{type:"bar",
      data:{labels:secKeys,datasets:[
        {label:"Pass",data:secKeys.map(function(k){return sec[k].Pass;}),backgroundColor:COLORS.Pass},
        {label:"Fail",data:secKeys.map(function(k){return sec[k].Fail;}),backgroundColor:COLORS.Fail},
        {label:"Blocked",data:secKeys.map(function(k){return sec[k].Blocked;}),backgroundColor:COLORS.Blocked},
        {label:"Not run",data:secKeys.map(function(k){return sec[k]["Not run"];}),backgroundColor:COLORS["Not run"]}
      ]},
      options:{indexAxis:"y",responsive:true,maintainAspectRatio:false,
        scales:{x:{stacked:true,ticks:{precision:0}},y:{stacked:true,ticks:{font:{size:10}}}},
        plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}}}}));

    // detail filtering
    var sorted=rows.slice().sort(function(a,b){
      var r=(ORDER[a.result]||9)-(ORDER[b.result]||9); if(r)return r;
      return String(a.id).localeCompare(String(b.id),undefined,{numeric:true});});
    function drawDetail(){
      var ft=document.getElementById("f-tester").value,fr=document.getElementById("f-res").value,
          fq=document.getElementById("f-q").value.toLowerCase();
      var body=sorted.filter(function(r){
        if(ft&&r.tester!==ft)return false;
        if(fr&&(r.result||"Not run")!==fr)return false;
        if(fq&&(String(r.id)+" "+String(r.title)).toLowerCase().indexOf(fq)<0)return false;
        return true;
      }).map(function(r){return '<tr><td class="id">'+esc(r.id)+'</td><td>'+esc(r.title)+'</td><td>'+esc(r.tester)+
        '</td><td>'+pill(r.result)+'</td><td class="note">'+esc(r.note)+'</td><td class="note">'+esc(fmt(r.ts))+'</td></tr>';
      }).join("");
      document.getElementById("detail").innerHTML=body||'<tr><td colspan="6" class="state">No matching rows.</td></tr>';
    }
    ["f-tester","f-res"].forEach(function(id){document.getElementById(id).onchange=drawDetail;});
    document.getElementById("f-q").oninput=drawDetail;
    drawDetail();
  }

  function load(){
    document.getElementById("content").innerHTML='<div class="state">Loading results…</div>';
    jsonp("results",function(d){
      if(d){render(d);return;}
      document.getElementById("content").innerHTML='<div class="state">Waking up the script… retrying.</div>';
      jsonp("results",render);
    });
  }
  document.getElementById("refresh").onclick=load;
  load();
})();
</script>
</body>
</html>
